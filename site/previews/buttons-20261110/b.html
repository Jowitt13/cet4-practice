</style></head><body><header class="preview-head"><div class="preview-title"><strong>B · 柔和胶囊</strong><nav class="variant-links"><a href="./a.html" aria-label="查看方案A">A</a><a href="./c.html" aria-label="查看方案C">C</a><a href="../../">正式网站</a></nav></div><p>全站样式预览，可切换下面四个页面。草稿状态仅为布局示意，不保存数据。</p><nav class="screen-switch" aria-label="预览页面"><button data-view="home">首页</button><button data-view="catalog" aria-current="page">选卷页</button><button data-view="exam">做题页</button><button data-view="records">记录页</button></nav></header><div class="appbar"><strong class="brand">CET-4</strong><div class="toolbar"><button data-screen="records">学习记录</button><button data-demo>错题本</button><button data-theme>深色</button></div></div><main id="preview"></main><div id="message" role="status" hidden></div><script>
const scheme="b",sample={"stem": "Questions 1 and 2 are based on the news report you have just heard.", "options": [{"letter": "A", "textEn": "She was born months after the end of World War I."}, {"letter": "B", "textEn": "She has been living in her house throughout her life."}, {"letter": "C", "textEn": "She suffered a great deal during the Second World War."}, {"letter": "D", "textEn": "She is a 102-year-old woman living in Somerset Village."}]},names={a:'轻底圆角',b:'柔和胶囊',c:'轻浮起'};let screen='catalog',timer;
const titles=['2026年6月 第2套','2026年6月 第1套','2025年12月 第2套'];const btn=(text,primary=false)=>`<button ${primary?'class="primary"':''} data-demo>${text}</button>`;
const footer=`<section class="control-demo"><h2>按钮状态对照</h2><div>${btn('主要操作',true)}${btn('普通操作')}<button aria-pressed="true" data-toggle>已选中</button><button disabled>暂不可用</button></div></section>`;
function catalog(){let rows='';if(scheme==='a'){rows=`<h2 class="year">2026</h2><div class="exam-list">${titles.slice(0,2).map((title,i)=>`<article class="paper-card"><div class="paper-title"><h3>${title}</h3>${i===0?'<small>有未完成草稿</small>':''}</div><div class="paper-actions">${btn(i===0?'继续作答':'开始练习',true)}${btn('按部分练')}${btn('原题与解析')}</div></article>`).join('')}</div><h2 class="year">2025</h2><article class="paper-card"><h3>${titles[2]}</h3><div class="paper-actions">${btn('开始练习',true)}${btn('按部分练')}${btn('原题与解析')}</div></article>`}else if(scheme==='b'){rows=`<h2 class="year">2026</h2><div class="year-group">${titles.slice(0,2).map((title,i)=>`<article class="group-row"><div class="row-top"><h3>${title}</h3>${btn(i===0?'继续作答':'开始练习',true)}</div><details class="more"><summary>更多操作</summary><div class="more-actions">${btn('按部分练')}${btn('原题与解析')}</div></details></article>`).join('')}</div><h2 class="year">2025</h2><div class="year-group"><article class="group-row"><div class="row-top"><h3>${titles[2]}</h3>${btn('开始练习',true)}</div><details class="more"><summary>更多操作</summary><div class="more-actions">${btn('按部分练')}${btn('原题与解析')}</div></details></article></div>`}else{rows=`<h2 class="year">2026</h2><div class="exam-list">${titles.slice(0,2).map((title,i)=>`<details class="fold-paper" ${i===0?'open':''}><summary><h3>${title}</h3></summary><div class="fold-body">${btn(i===0?'继续作答':'开始练习',true)}<div class="more-actions">${btn('按部分练')}${btn('原题与解析')}</div></div></details>`).join('')}</div><h2 class="year">2025</h2><details class="fold-paper"><summary><h3>${titles[2]}</h3></summary><div class="fold-body">${btn('开始练习',true)}<div class="more-actions">${btn('按部分练')}${btn('原题与解析')}</div></div></details>`}return`<div class="catalog-top"><h1>完整模考</h1><button data-screen="home">返回首页</button></div><div class="filters"><input aria-label="搜索试卷" placeholder="搜索试卷"><select aria-label="年份"><option>全部年份</option><option>2026</option><option>2025</option></select><button data-reset>重置筛选</button></div><div id="papers">${rows}</div>${footer}`}
function home(){return`<h1 class="greeting">今天，想练什么？</h1><div class="home-grid">${['完整模考','听力专项','阅读专项','选词填空','段落匹配','仔细阅读','写作专项','翻译专项'].map((t,i)=>`<button data-screen="catalog" ${i===0?'class="primary"':''}>${t}</button>`).join('')}</div><section class="home-next"><div><h2>练习记录</h2><p>完成练习后保存每次成绩</p></div><button data-screen="records">全部记录</button></section>${footer}`}
function exam(){return`<div class="back-row"><button data-screen="catalog">返回试卷列表</button><button data-screen="home">返回首页</button></div><h1>2026年6月 第2套</h1><nav class="partnav" aria-label="试卷部分">${['听力','阅读','写作','翻译'].map((x,i)=>`<button data-part="${x}" aria-current="${i===0?'page':'false'}">${x}</button>`).join('')}</nav><div class="workbar"><div><time>25:00</time><button data-demo>开始计时</button></div><div>${btn('保存草稿')}${btn('交卷并复盘',true)}</div></div><div class="question"><h2>${sample.stem}</h2><strong>1.</strong>${sample.options.map(o=>`<label class="answer"><input type="radio" name="demo-answer" value="${o.letter}"><span>${o.letter}) ${o.textEn}</span></label>`).join('')}</div><div class="record-actions">${btn('不确定')}${btn('稍后再看')}</div>${footer}`}
function records(){return`<div class="back-row"><button data-screen="home">返回首页</button></div><h1>学习记录</h1><div class="record-actions">${btn('导出完整备份',true)}${btn('导入备份')}</div><h2 class="year">记录行示意</h2><article class="record"><h3>2026年6月 第2套</h3><small>交卷后可查看当次成绩与错题</small><div class="record-actions">${btn('查看成绩',true)}${btn('查看错题')}${btn('再次练习')}</div></article>${footer}`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===screen?'page':'false'));document.getElementById('preview').innerHTML=({catalog,home,exam,records})[screen]();window.scrollTo(0,0)}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.screen||b.dataset.view){screen=b.dataset.screen||b.dataset.view;render()}else if(b.hasAttribute('data-theme')){const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';b.textContent=dark?'深色':'浅色'}else if(b.hasAttribute('data-part')){document.querySelectorAll('[data-part]').forEach(x=>x.setAttribute('aria-current',x===b?'page':'false'))}else if(b.hasAttribute('data-toggle')){const v=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!v));b.textContent=v?'未选中':'已选中'}else if(b.hasAttribute('data-reset')){document.querySelector('.filters input').value='';document.querySelector('.filters select').value='全部年份';filter()}else if(b.hasAttribute('data-demo')){const m=document.getElementById('message');m.textContent='布局预览，不保存作答或记录';m.hidden=false;clearTimeout(timer);timer=setTimeout(()=>m.hidden=true,1800)}});
function filter(){const query=document.querySelector('.filters input')?.value||'',year=document.querySelector('.filters select')?.value;document.querySelectorAll('.paper-card,.group-row,.fold-paper').forEach(r=>r.hidden=!(r.querySelector('h3').textContent.includes(query)&&(year==='全部年份'||r.querySelector('h3').textContent.includes(year))))}document.addEventListener('input',e=>{if(e.target.closest('.filters'))filter()});document.addEventListener('change',e=>{if(e.target.closest('.filters'))filter()});render();
</script></body></html>
