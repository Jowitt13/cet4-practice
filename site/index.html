<script id="opening-settings" type="application/json">{"durationMs": 2700, "settleMs": 2200, "frameStepMs": 340}</script>
<script>(()=>{'use strict';
 const cover=document.getElementById('opening-cover'),settings=JSON.parse(document.getElementById('opening-settings').textContent),frames=[...cover.querySelectorAll('.opening-documents img')],enterButton=document.getElementById('opening-enter'),replayButton=document.getElementById('opening-replay'),progress=document.getElementById('opening-progress'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const inertBefore=new Map();let active=false,ready=false,phase='loading',raf=0,epoch=0,runCount=0,index=0,previousFocus=null,previousY=0,transitionTimer=0,frameLog=[];
 function setPhase(value){phase=value;cover.dataset.phase=value}
 function lock(value){for(const el of [document.querySelector('.appbar'),document.getElementById('app')])if(el){if(value){if(!inertBefore.has(el))inertBefore.set(el,el.inert);el.inert=true}else if(inertBefore.has(el)){el.inert=inertBefore.get(el);inertBefore.delete(el)}}}
 function scatterBars(){if(reduced.matches)return;for(const r of cover.querySelectorAll('.opening-redactions rect')){const width=110+Math.random()*230;let y;do{y=60+Math.random()*840}while(y>400&&y<670);r.setAttribute('x',String(Math.round(30+Math.random()*(940-width))));r.setAttribute('y',String(Math.round(y)));r.setAttribute('width',String(Math.round(width)));r.setAttribute('height',String(Math.round(13+Math.random()*9)))}}
 function setFrame(i,elapsed=0){scatterBars();frames.forEach((f,n)=>f.classList.toggle('is-current',n===i));index=i;frameLog.push({index:i,elapsed:Math.round(elapsed)})}
 function restoreImages(){frames.forEach(f=>{if(!f.hasAttribute('src'))f.src=f.dataset.coverSrc});return Promise.allSettled(frames.map(f=>f.decode?.()||Promise.resolve()))}
 function stop(){cancelAnimationFrame(raf);raf=0;epoch++}
 function finish(){if(phase==='leaving')return;stop();if(!active)return;setPhase(ready?'ready':'loading');replayButton.disabled=!ready||reduced.matches;replayButton.title=reduced.matches?'已按系统设置减少动态效果':''}
 async function replay(){if(!active||!ready)return;stop();const current=epoch;frameLog=[];runCount++;await restoreImages();if(!active||epoch!==current)return;if(reduced.matches||document.hidden){setFrame(frames.length-1);finish();return}setFrame(0);setPhase('playing');const start=performance.now();const step=now=>{if(!active||current!==epoch)return;const elapsed=Math.max(0,now-start),i=Math.min(frames.length-1,Math.floor(elapsed/settings.frameStepMs));if(index!==i)setFrame(i,elapsed);if(elapsed>=settings.settleMs&&phase==='playing')setPhase('settling');if(elapsed>=settings.durationMs){finish();return}raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
 function show(){stop();clearTimeout(transitionTimer);if(!active){previousFocus=document.activeElement;previousY=scrollY}active=true;cover.hidden=false;cover.inert=false;document.documentElement.classList.add('opening-active');lock(true);document.querySelectorAll('audio').forEach(a=>a.pause());if(!frames[0].hasAttribute('src'))frames[0].src=frames[0].dataset.coverSrc;setFrame(0);setPhase(ready?'ready':'loading');enterButton.disabled=!ready;replayButton.disabled=!ready||reduced.matches;if(ready){enterButton.textContent='进入练习';progress.hidden=true;replay()}cover.querySelector('h1').focus({preventScroll:true})}
 function enter(){if(!active||!ready||phase==='leaving')return;stop();setPhase('leaving');cover.inert=true;document.documentElement.classList.remove('opening-active');lock(false);transitionTimer=setTimeout(()=>{if(phase!=='leaving')return;cover.hidden=true;active=false;setPhase('entered');frames.forEach(f=>f.removeAttribute('src'));window.scrollTo({top:previousY,behavior:'instant'});const target=previousFocus?.isConnected&&previousFocus!==document.body?previousFocus:document.querySelector('.simple-mode-card');target?.focus({preventScroll:true})},reduced.matches?0:230)}
 function reportProgress(done,total){if(ready)return;const value=Math.max(0,Math.min(1,done/total));progress.value=value;enterButton.textContent='正在准备题库 '+Math.round(value*100)+'%'}

 enterButton.addEventListener('click',enter);replayButton.addEventListener('click',replay);document.addEventListener('keydown',e=>{if(active&&e.key==='Escape'){e.preventDefault();finish();if(ready)enterButton.focus({preventScroll:true})}});document.addEventListener('visibilitychange',()=>{if(active&&document.hidden)finish()});reduced.addEventListener('change',()=>{if(active&&reduced.matches)finish();replayButton.disabled=!ready||reduced.matches});
 cover.querySelectorAll('.opening-redactions rect').forEach((r,i)=>r.style.setProperty('--bar-order',i));
 window.CET4_OPENING={show,replay,enter,finish,progress:reportProgress,get state(){return{active,ready,phase,index,runCount,reducedMotion:reduced.matches,silent:true,durationMs:settings.durationMs,frameLog:[...frameLog]}}};
 document.addEventListener('DOMContentLoaded',()=>{ready=true;lock(active);enterButton.disabled=false;enterButton.textContent='进入练习';progress.hidden=true;replayButton.disabled=reduced.matches;if(active)replay()},{once:true});
 show();
})();
</script>
